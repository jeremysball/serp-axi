[tools]
node = "26.5.1"
# ladder-cli builds against these; CI installs them through jdx/mise-action, the
# same path .mise.toml already gives CI for Node.
python = "3.14"
uv = "0.12.23"

[tasks.build]
run = "npm run build"

[tasks.typecheck]
run = "npm run typecheck"

[tasks.test]
run = "npm test"

[tasks.check]
run = "npm run check"
