name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Single collapsed job rather than a [lint, typecheck, unit] matrix — see
    # scaffolding-repos: this account's shared Actions concurrent-runner cap
    # saturates once a few PRs are open across repos, leaving matrix legs
    # queued 10-20+ min for a runner slot. One job means one runner request
    # per push/PR; the tradeoff is legs running sequentially instead of in
    # parallel.
    #
    # No lint leg: typescript-eslint hard-refuses to run against TS 7.x as
    # of this writing (typescript-eslint/typescript-eslint#10940, still
    # open) and serp-axi pins typescript@7.0.2. `typecheck` (strict tsc)
    # is the real static gate until that support ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise (reads .mise.toml for the pinned Node version)
        uses: jdx/mise-action@v2

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install Bubblewrap for the mutation sandbox
        # GitHub's ubuntu-latest image does not ship bwrap, and Ubuntu 24.04+
        # restricts unprivileged user namespaces via AppArmor; the knob relax
        # is guarded because the kernel may not expose it, and the verify step
        # right below is the real gate on the capability.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true

      - name: Verify mutation sandbox support
        run: |
          if ! command -v bwrap >/dev/null; then
            printf '%s\n' 'Bubblewrap (bwrap) is required by the mutation safety tests.' >&2
            exit 1
          fi
          if ! bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent --new-session --cap-drop ALL -- python3 -c 'print("mutation sandbox ready")'; then
            printf '%s\n' 'Bubblewrap must support unprivileged user namespaces on this runner.' >&2
            exit 1
          fi

      - name: Run ladder-cli tests
        # Pins come from uv.lock; --frozen fails the build if the lockfile no
        # longer matches pyproject.toml, so a drifting pin cannot pass CI
        # silently. Without this leg pytest would rot unnoticed, which is the
        # H1/H12 shape the plan exists to avoid.
        working-directory: ladder-cli
        run: uv run --frozen --extra test pytest -q

      - name: Run the named mutation gate
        # A green suite only says the tests that exist still pass. This leg says
        # which BELIEFS that suite holds, falsifies each one in turn, and fails
        # the build when a belief survives (a hollow test, asserted but not
        # enforced) or when a belief can no longer be applied (the code moved and
        # the claim did not). This is the check that a passing suite cannot
        # perform on itself.
        run: npm run test:mutations
